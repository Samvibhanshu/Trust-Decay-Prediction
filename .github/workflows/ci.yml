name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4      # one test syntax-checks the dashboard's JavaScript with node
        with:
          node-version: 22
      # requirements.txt pins scikit-learn==1.8.0 because artifacts/model_bundle.joblib only loads on that version
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
